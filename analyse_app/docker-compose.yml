# analyse.pdhc compose — group/population + federated-events engine.
# Loopback-only deploy: both containers publish on 127.0.0.1 ONLY.
services:
  db:
    image: postgres:16
    container_name: analyse_pdhc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-9111}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: analyse_pdhc_app
    restart: unless-stopped
    env_file: .env
    environment:
      # +psycopg2 is explicit on purpose: a bare postgresql:// lets the
      # installed SQLAlchemy pick the driver, and 2.1 changed that pick.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${APP_PORT:-9110}:9110"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: ${DB_VOLUME:-analyse_pdhc_pgdata}
