<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose patient · analyse.pdhc</title>
<style>
  :root { --border:#d9dde3; --card-bg:#fff; --primary:#2a6ebb; --muted:#667;
          --block:#b3261e; --ok:#1c7d46; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:#f5f6f8;
         color:#1a1d21; font-size:12px; }
  header { display:flex; align-items:center; gap:1.2rem;
           padding:.6rem 1.1rem; background:#fff; border-bottom:1px solid var(--border); }
  header .brand { font-weight:700; color:#1f3c6e; }
  nav { display:flex; gap:1rem; align-items:center; }
  nav a { color:var(--primary); text-decoration:none; padding:.2rem .1rem; }
  nav a.active { color:#1a1d21; font-weight:700; border-bottom:2px solid var(--primary); }
  header .spacer { margin-left:auto; }
  main { max-width:70rem; margin:1.1rem auto; padding:0 1rem; }
  button { font:inherit; padding:.35rem .8rem; border:1px solid var(--primary);
           background:var(--primary); color:#fff; border-radius:4px; cursor:pointer; }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:6px;
          padding:.8rem 1rem; margin-bottom:1rem; }
  .card h2 { font-size:1rem; margin:0 0 .5rem; }
  .cdrs { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
  .cdrs label { display:inline-flex; gap:.3rem; align-items:center; }
  .status { color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:.35rem .5rem; border-bottom:1px solid #eee; text-align:left; }
  th { color:var(--muted); font-weight:600; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#eef4fb; }
  .guid { font:.9em ui-monospace,Menlo,monospace; color:var(--muted); cursor:help; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:.05rem .4rem; border-radius:10px; font-size:.85em; }
  .badge.block { background:#fde7e5; color:var(--block); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <span class="brand">analyse.pdhc</span>
  <nav>
    <a href="https://www.pdhc.se/services.html">PDHC / services</a>
    <a href="/" class="active">choose patient</a>
    <a href="#" id="nav-dashboard">Dashboard</a>
    <a href="/researcher">Researcher</a>
    <a href="/admin/sparr-log">Spärrlogg</a>
  </nav>
  <span class="spacer"></span>
  <a href="/auth/logout" style="color:var(--primary);text-decoration:none;">Log out</a>
</header>

<main>
  <div class="card">
    <h2>Välj CDR</h2>
    <div class="cdrs" id="cdrs"><span class="status">Laddar CDR:er…</span></div>
    <p style="margin:.6rem 0 0;">
      <button id="refresh">Uppdatera</button>
      <span id="status" class="status"></span>
    </p>
  </div>

  <div class="card">
    <h2>Patienter</h2>
    <table>
      <thead>
        <tr>
          <th>Namn</th><th>Födelseår</th><th>Patient-GUID</th>
          <th class="num">Datapunkter</th><th>Senaste data</th><th>Spärr</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="status">Laddar…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);

async function loadCdrs() {
  const box = $("#cdrs");
  try {
    const r = await fetch("/api/cdrs", {headers:{Accept:"application/json"}});
    const j = await r.json();
    const cdrs = (j.cdrs || []);
    if (!cdrs.length) { box.innerHTML = '<span class="status">Inga CDR:er konfigurerade.</span>'; return; }
    box.innerHTML = cdrs.map(c =>
      `<label><input type="checkbox" class="cdrpick" value="${c.cdr_id}" checked> ${c.cdr_id}</label>`
    ).join("");
  } catch (e) {
    box.innerHTML = '<span class="status">Kunde inte läsa CDR-listan.</span>';
  }
}

function selectedCdrs() {
  return Array.from(document.querySelectorAll(".cdrpick:checked")).map(el => el.value);
}

function fmtDate(d) {
  if (!d) return "—";
  return String(d).slice(0, 10);
}

async function loadPatients() {
  const tbody = $("#rows");
  const status = $("#status");
  tbody.innerHTML = '<tr><td colspan="6" class="status">Laddar…</td></tr>';
  const cdrs = selectedCdrs();
  const qs = cdrs.length ? ("?cdr_ids=" + encodeURIComponent(cdrs.join(","))) : "";
  try {
    const r = await fetch("/api/patients" + qs, {headers:{Accept:"application/json"}});
    if (!r.ok) { tbody.innerHTML = `<tr><td colspan="6" class="status">Fel: HTTP ${r.status}</td></tr>`; return; }
    const j = await r.json();
    const rows = j.patients || [];
    status.textContent = `${j.count} patienter · ${j.blocked_count} spärrade · CDR-status: ${j.fanout_mode}` +
                         (j.is_admin ? " · admin (alla data)" : "");
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="6" class="status">Inga patienter i ditt scope.</td></tr>'; return; }
    tbody.innerHTML = rows.map(p => {
      const g = p.patient_guid || "";
      const shortG = g.length > 12 ? g.slice(0,8) + "…" : g;
      const block = p.blocked
        ? '<span class="badge block">spärrad</span>' : '';
      const name = p.name ? p.name : '<span class="status">(namn saknas)</span>';
      return `<tr data-guid="${g}">
        <td>${name}</td>
        <td>${p.birth_year || "—"}</td>
        <td><span class="guid" title="${g}">${shortG}</span></td>
        <td class="num">${p.blocked ? "—" : p.datapoints}</td>
        <td>${fmtDate(p.latest_date)}</td>
        <td>${block}</td>
      </tr>`;
    }).join("");
    tbody.querySelectorAll("tr[data-guid]").forEach(tr => {
      tr.addEventListener("click", () => { location.href = "/patient/" + tr.dataset.guid; });
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="6" class="status">Kunde inte läsa patientlistan.</td></tr>';
  }
}

$("#refresh").addEventListener("click", loadPatients);
$("#nav-dashboard").addEventListener("click", (e) => {
  e.preventDefault();
  alert("Välj en patient i listan för att öppna dess Dashboard.");
});

(async () => { await loadCdrs(); await loadPatients(); })();
</script>
</body>
</html>
