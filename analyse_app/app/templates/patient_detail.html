<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient · analyse.pdhc</title>
<style>
  :root { --border:#d9dde3; --card-bg:#fff; --primary:#2a6ebb; --muted:#667;
          --block:#b3261e; --ok:#1c7d46; --spark:#2a6ebb; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:#f5f6f8;
         color:#1a1d21; font-size:12px; }
  header { display:flex; align-items:center; gap:1.2rem;
           padding:.6rem 1.1rem; background:#fff; border-bottom:1px solid var(--border); }
  header .brand { font-weight:700; color:#1f3c6e; }
  nav { display:flex; gap:1rem; align-items:center; }
  nav a { color:var(--primary); text-decoration:none; padding:.2rem .1rem; }
  header .spacer { margin-left:auto; }
  main { max-width:70rem; margin:1.1rem auto; padding:0 1rem; }
  button { font:inherit; padding:.35rem .8rem; border:1px solid var(--primary);
           background:var(--primary); color:#fff; border-radius:4px; cursor:pointer; }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:6px;
          padding:.8rem 1rem; margin-bottom:1rem; }
  .card h2 { font-size:1rem; margin:0 0 .5rem; }
  .patient-head { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
  .patient-head .name { font-size:1.25rem; font-weight:700; }
  .guid { font:.9em ui-monospace,Menlo,monospace; color:var(--muted); }
  .cdrs { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
  .cdrs label { display:inline-flex; gap:.3rem; align-items:center; }
  .status { color:var(--muted); }
  .banner { border-radius:6px; padding:.6rem .9rem; margin-bottom:1rem; }
  .banner.block { background:#fde7e5; color:var(--block); border:1px solid #f3b6b1; }
  .banner.exposure { background:#fff4e5; color:#8a5300; border:1px solid #f0d29a; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:.3rem .5rem; border-bottom:1px solid #eee; text-align:left;
           vertical-align:middle; }
  th { color:var(--muted); font-weight:600; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .series-label { font-weight:600; }
  .series-code { font:.85em ui-monospace,Menlo,monospace; color:var(--muted); }
  svg.spark { display:block; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <span class="brand">analyse.pdhc</span>
  <nav>
    <a href="https://www.pdhc.se/services.html">PDHC / services</a>
    <a href="/">choose patient</a>
    <a href="#" class="active" aria-current="page">Dashboard</a>
    <a href="/researcher">Researcher</a>
  </nav>
  <span class="spacer"></span>
  <a href="/auth/logout" style="color:var(--primary);text-decoration:none;">Log out</a>
</header>

<main>
  <div class="card">
    <div class="patient-head">
      <span class="name" id="p-name">Laddar…</span>
      <span id="p-birth" class="status"></span>
      <span class="guid" id="p-guid">{{ patient_guid }}</span>
    </div>
    <p style="margin:.5rem 0 0;"><a href="/" style="color:var(--primary);text-decoration:none;">&larr; Tillbaka till patientlistan</a></p>
  </div>

  <div id="banner" hidden></div>

  <div class="card">
    <h2>Välj CDR</h2>
    <div class="cdrs" id="cdrs"><span class="status">Laddar CDR:er…</span></div>
    <p style="margin:.6rem 0 0;">
      <button id="refresh">Uppdatera</button>
      <span id="status" class="status"></span>
    </p>
  </div>

  <div class="card">
    <h2>Serier</h2>
    <table>
      <thead>
        <tr>
          <th>Mätvärde</th><th>Enhet</th><th class="num">Datapunkter</th>
          <th>Senaste</th><th>Trend</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="status">Laddar…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const PATIENT = {{ patient_guid | tojson }};
const $ = (s) => document.querySelector(s);

async function loadCdrs() {
  const box = $("#cdrs");
  try {
    const r = await fetch("/api/cdrs", {headers:{Accept:"application/json"}});
    const j = await r.json();
    const cdrs = (j.cdrs || []);
    if (!cdrs.length) { box.innerHTML = '<span class="status">Inga CDR:er konfigurerade.</span>'; return; }
    box.innerHTML = cdrs.map(c =>
      `<label><input type="checkbox" class="cdrpick" value="${c.cdr_id}" checked> ${c.cdr_id}</label>`
    ).join("");
  } catch (e) {
    box.innerHTML = '<span class="status">Kunde inte läsa CDR-listan.</span>';
  }
}

function selectedCdrs() {
  return Array.from(document.querySelectorAll(".cdrpick:checked")).map(el => el.value);
}

function fmtDate(d) { return d ? String(d).slice(0, 10) : "—"; }

// Minimal dependency-free sparkline: numeric points only.
function sparkline(points) {
  const nums = points.map(p => typeof p.value === "number" ? p.value : Number(p.value))
                     .filter(v => Number.isFinite(v));
  if (nums.length < 2) return "";
  const w = 120, h = 26, pad = 2;
  const min = Math.min(...nums), max = Math.max(...nums);
  const span = (max - min) || 1;
  const step = (w - 2 * pad) / (nums.length - 1);
  const path = nums.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / span) * (h - 2 * pad);
    return `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="trend">
    <path d="${path}" fill="none" stroke="var(--spark)" stroke-width="1.4"/>
  </svg>`;
}

function setBanner(j) {
  const el = $("#banner");
  if (j.blocked) {
    el.className = "banner block";
    el.textContent = "Spärrade uppgifter — den här patienten har en aktiv spärr. Kliniska data är dolda för din behörighet.";
    el.hidden = false;
  } else if (j.exposure) {
    el.className = "banner exposure";
    el.textContent = "Nödöppning (admin): patienten har en aktiv spärr men data visas i kraft av din admin-behörighet. Åtkomsten loggas.";
    el.hidden = false;
  } else {
    el.hidden = true;
  }
}

async function loadDetail() {
  const tbody = $("#rows");
  const status = $("#status");
  tbody.innerHTML = '<tr><td colspan="5" class="status">Laddar…</td></tr>';
  const cdrs = selectedCdrs();
  const qs = cdrs.length ? ("?cdr_ids=" + encodeURIComponent(cdrs.join(","))) : "";
  try {
    const r = await fetch("/api/patient/" + encodeURIComponent(PATIENT) + qs,
                          {headers:{Accept:"application/json"}});
    if (!r.ok) { tbody.innerHTML = `<tr><td colspan="5" class="status">Fel: HTTP ${r.status}</td></tr>`; return; }
    const j = await r.json();
    $("#p-name").textContent = j.name || "(namn saknas)";
    $("#p-birth").textContent = j.birth_year ? ("f. " + j.birth_year) : "";
    setBanner(j);
    status.textContent = `${j.total_points} datapunkter · ${(j.series||[]).length} serier · CDR-status: ${j.fanout_mode}` +
                         (j.is_admin ? " · admin" : "");
    const series = j.series || [];
    if (!series.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="status">${j.blocked ? "Data dolda (spärr)." : "Inga observationer i valda CDR:er."}</td></tr>`;
      return;
    }
    tbody.innerHTML = series.map(s => {
      const last = s.points && s.points.length ? s.points[s.points.length - 1] : null;
      const lastVal = last && last.value != null ? last.value : "—";
      return `<tr>
        <td><span class="series-label">${s.label || s.code}</span><br>
            <span class="series-code" title="${s.code}">${s.code}</span></td>
        <td>${s.unit || "—"}</td>
        <td class="num">${s.count}</td>
        <td>${fmtDate(s.latest)} <span class="status">(${lastVal})</span></td>
        <td>${sparkline(s.points || [])}</td>
      </tr>`;
    }).join("");
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="status">Kunde inte läsa patientdata.</td></tr>';
  }
}

$("#refresh").addEventListener("click", loadDetail);
(async () => { await loadCdrs(); await loadDetail(); })();
</script>
</body>
</html>
